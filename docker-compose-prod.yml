version: '3.8'

services:
  # --- Reverse Proxy qui écoute sur le port 5050 ---
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-reverse-proxy
    ports:
      - "5050:80"  # <--- Le port externe est maintenant 5050 !
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped
    networks:
      - app-network

  # --- Backend API ---
  backend:
    image: iliasalami/alami_repo_ynov_backend:v1.0.0
    container_name: prod_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Frontend Nginx ---
  frontend:
    image: iliasalami/alami_repo_ynov_frontend:v1.0.0
    container_name: prod_frontend
    restart: unless-stopped
    expose:
      - "80"  # Le port interne sur lequel écoute le serveur Nginx du frontend
    environment:
      - VIRTUAL_HOST=mon-app.local # Ou l'IP de votre serveur / localhost
      - VIRTUAL_PORT=80            # Transmet vers le port 80 interne de frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge