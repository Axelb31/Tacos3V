version: '3.8'

services:
  # --- Reverse Proxy Nginx ---
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # <-- Port HTTPS requis !
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - app-network

  # --- Compagnon Let's Encrypt (SSL Automatique) ---
  nginx-proxy-acme:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: unless-stopped
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=votre-email@exemple.com  # <-- Mettez votre vraie adresse e-mail !
    depends_on:
      - nginx-proxy
    networks:
      - app-network

  # --- Backend API ---
  backend:
    build: ./Backend
    image: tacos3v-backend:latest
    container_name: prod_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Frontend Nginx ---
  frontend:
    build: ./Frontend
    image: tacos3v-frontend:latest
    container_name: prod_frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=tacos3v.jnbvnt.fr
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=tacos3v.jnbvnt.fr # <-- Génère le certificat SSL pour ce domaine
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

# --- Volumes pour stocker durablement les certificats ---
volumes:
  certs:
  vhost:
  html:
  acme:

networks:
  app-network:
    driver: bridge
